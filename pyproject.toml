# Linting configuration only. The repository is a research artifact and is not
# packaged; install the pinned dependencies from requirements.txt instead.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "experiments/progent/progent-repo",   # upstream library cloned by the README commands
    "paper",
    "results",
    "figures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The research scripts are kept exactly as they ran for the paper; only syntax
# errors (E9), undefined or redefined names (F8) and clear misuse (F5, F6, F7)
# are enforced there. Style rules apply in full to tests/ and to new code.
"pep/**" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "I", "B", "F401", "F841"]
"experiments/**" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "I", "B", "F401", "F841"]
"data/**" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "I", "B", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["pep22", "pep_b22", "pep", "pep_b", "attacks_ext", "local_llm", "providers", "bedrock_llm", "cost_ledger"]
